<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4CAF50">
    <title>Scanner de Codigo de Barras - Comparador de Precos</title>
    <!-- ZXing suporta códigos de barras lineares (EAN-13, EAN-8, UPC, Code128) + QR Codes -->
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #2196F3;
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            min-height: 100vh;
        }

        .header {
            background: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 { font-size: 1.5rem; }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn.active {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: white;
        }

        .scanner-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        #video {
            width: 100%;
            border-radius: 12px;
            background: #000;
        }

        #canvas { display: none; }

        .scanner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 100px;
            border: 3px solid var(--primary-color);
            border-radius: 8px;
            pointer-events: none;
        }

        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--primary-color);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background: #f0fff0;
        }

        .upload-area input { display: none; }
        .upload-area span { font-size: 3rem; display: block; margin-bottom: 10px; }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-primary { background: var(--primary-color); color: white; }
        .btn-secondary { background: var(--secondary-color); color: white; }
        .btn-stop { background: #f44336; color: white; }

        .resultado {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .produto-encontrado {
            text-align: center;
        }

        .produto-encontrado img {
            max-width: 150px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .produto-encontrado h3 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .preco-lista {
            margin-top: 15px;
            text-align: left;
        }

        .preco-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .ean-display {
            background: #333;
            color: #0f0;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 1.5rem;
            text-align: center;
            margin: 15px 0;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary-color);
            text-decoration: none;
        }

        .hidden { display: none !important; }

        .status {
            text-align: center;
            padding: 10px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Scanner de Codigo de Barras</h1>
    </div>

    <div class="container">
        <a href="/" class="back-link">← Voltar</a>

        <div class="card">
            <div class="mode-selector">
                <button class="mode-btn active" onclick="setMode('camera')" id="btnCamera">
                    📷 Camera
                </button>
                <button class="mode-btn" onclick="setMode('upload')" id="btnUpload">
                    📁 Upload
                </button>
            </div>

            <!-- Modo Camera -->
            <div id="cameraMode">
                <div class="scanner-container">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="canvas"></canvas>
                    <div class="scanner-overlay">
                        <div class="scanner-line"></div>
                    </div>
                </div>
                <p class="status" id="cameraStatus">Posicione o codigo de barras na area verde</p>
                <button class="btn btn-primary" id="btnStart" onclick="startCamera()">
                    Iniciar Camera
                </button>
                <button class="btn btn-stop hidden" id="btnStop" onclick="stopCamera()">
                    Parar Camera
                </button>
            </div>

            <!-- Modo Upload -->
            <div id="uploadMode" class="hidden">
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <span>📷</span>
                    <p>Clique ou arraste uma foto do codigo de barras</p>
                    <input type="file" id="fileInput" accept="image/*" onchange="handleFileUpload(event)">
                </div>
            </div>
        </div>

        <!-- Resultado -->
        <div id="resultado" class="hidden"></div>
    </div>

    <script src="/src/app.js?v=20250108c"></script>
    <script>
        // Auth guard
        if (!localStorage.getItem('auth_token')) {
            window.location.href = '/?login=required';
        }

        let video, canvas, ctx;
        let scanning = false;
        let stream = null;
        let codeReader = null;

        // Inicializa o ZXing com suporte a múltiplos formatos de código de barras
        document.addEventListener('DOMContentLoaded', () => {
            video = document.getElementById('video');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            // Configura hints para melhorar detecção
            const hints = new Map();
            hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                ZXing.BarcodeFormat.EAN_13,
                ZXing.BarcodeFormat.EAN_8,
                ZXing.BarcodeFormat.UPC_A,
                ZXing.BarcodeFormat.UPC_E,
                ZXing.BarcodeFormat.CODE_128,
                ZXing.BarcodeFormat.CODE_39,
                ZXing.BarcodeFormat.ITF,
                ZXing.BarcodeFormat.QR_CODE
            ]);
            hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

            codeReader = new ZXing.BrowserMultiFormatReader(hints);
        });

        function setMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn${mode === 'camera' ? 'Camera' : 'Upload'}`).classList.add('active');

            document.getElementById('cameraMode').classList.toggle('hidden', mode !== 'camera');
            document.getElementById('uploadMode').classList.toggle('hidden', mode !== 'upload');

            if (mode !== 'camera') {
                stopCamera();
            }
        }

        async function startCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        focusMode: 'continuous'
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                await video.play();

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                document.getElementById('btnStart').classList.add('hidden');
                document.getElementById('btnStop').classList.remove('hidden');
                document.getElementById('cameraStatus').textContent = 'Escaneando... Aponte para o código de barras';

                scanning = true;
                scanFrame();
            } catch (error) {
                console.error('Erro ao acessar camera:', error);
                mostrarToastErroGlobal('Nao foi possivel acessar a camera. Verifique as permissoes.');
            }
        }

        function stopCamera() {
            scanning = false;

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            video.srcObject = null;

            document.getElementById('btnStart').classList.remove('hidden');
            document.getElementById('btnStop').classList.add('hidden');
            document.getElementById('cameraStatus').textContent = 'Camera parada';
        }

        async function scanFrame() {
            if (!scanning) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                try {
                    const result = await codeReader.decodeFromVideoElement(video);
                    if (result) {
                        console.log('Codigo encontrado:', result.text, 'Formato:', result.getBarcodeFormat());
                        handleBarcodeFound(result.text);
                        return;
                    }
                } catch (e) {
                    // NotFoundException é normal quando não há código no frame
                    if (!(e instanceof ZXing.NotFoundException)) {
                        console.error('Erro de leitura:', e);
                    }
                }
            }

            if (scanning) {
                setTimeout(() => requestAnimationFrame(scanFrame), 100);
            }
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('cameraStatus').textContent = 'Processando imagem...';

            const reader = new FileReader();
            reader.onload = async (e) => {
                const img = new Image();
                img.onload = async () => {
                    // Tenta decodificar localmente com ZXing (múltiplas tentativas)
                    const code = await tryDecodeImage(img);

                    if (code) {
                        handleBarcodeFound(code);
                    } else {
                        // Envia para API se nao encontrar localmente
                        console.log('Não encontrado localmente, enviando para API...');
                        await sendImageToAPI(file);
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function tryDecodeImage(img) {
            // Cria canvas para manipulação
            canvas.width = img.width;
            canvas.height = img.height;

            // Tenta múltiplas abordagens para melhorar detecção
            const attempts = [
                { scale: 1, contrast: 1, brightness: 0 },           // Original
                { scale: 1.5, contrast: 1.2, brightness: 10 },      // Ampliado + contraste
                { scale: 1, contrast: 1.5, brightness: 20 },        // Alto contraste
                { scale: 2, contrast: 1.3, brightness: 0 },         // Muito ampliado
                { scale: 1, contrast: 1, brightness: 0, grayscale: true }, // Escala de cinza
            ];

            for (const attempt of attempts) {
                try {
                    // Aplica transformações
                    const processedCanvas = processImage(img, attempt);
                    const result = await codeReader.decodeFromImageElement(processedCanvas);

                    if (result) {
                        console.log('Encontrado na tentativa:', attempt);
                        return result.text;
                    }
                } catch (e) {
                    // Continua tentando
                }
            }

            return null;
        }

        function processImage(img, options) {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');

            const scale = options.scale || 1;
            tempCanvas.width = img.width * scale;
            tempCanvas.height = img.height * scale;

            // Desenha imagem escalada
            tempCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);

            // Aplica filtros
            if (options.contrast !== 1 || options.brightness !== 0 || options.grayscale) {
                const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const data = imageData.data;

                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i];
                    let g = data[i + 1];
                    let b = data[i + 2];

                    // Grayscale
                    if (options.grayscale) {
                        const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                        r = g = b = gray;
                    }

                    // Contraste e brilho
                    r = Math.min(255, Math.max(0, (r - 128) * options.contrast + 128 + options.brightness));
                    g = Math.min(255, Math.max(0, (g - 128) * options.contrast + 128 + options.brightness));
                    b = Math.min(255, Math.max(0, (b - 128) * options.contrast + 128 + options.brightness));

                    data[i] = r;
                    data[i + 1] = g;
                    data[i + 2] = b;
                }

                tempCtx.putImageData(imageData, 0, 0);
            }

            // Retorna como elemento de imagem para o ZXing
            const resultImg = new Image();
            resultImg.src = tempCanvas.toDataURL();
            return tempCanvas;
        }

        async function sendImageToAPI(file) {
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_URL}/api/escanear-codigo-barras`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.sucesso && data.ean) {
                    handleBarcodeFound(data.ean);
                } else {
                    showError('Codigo de barras nao encontrado na imagem');
                }
            } catch (error) {
                console.error('Erro:', error);
                showError('Erro ao processar imagem');
            }
        }

        async function handleBarcodeFound(ean) {
            stopCamera();

            const resultado = document.getElementById('resultado');
            resultado.classList.remove('hidden');
            resultado.innerHTML = `
                <div class="ean-display">${ean}</div>
                <p class="status">Buscando produto...</p>
            `;

            try {
                const formData = new FormData();
                formData.append('ean', ean);

                const response = await fetch(`${API_URL}/api/buscar-ean`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.sucesso) {
                    showProductResult(data, ean);
                } else {
                    showNotFound(ean, data.erro);
                }
            } catch (error) {
                console.error('Erro:', error);
                showError('Erro ao buscar produto');
            }
        }

        function showProductResult(data, ean) {
            const resultado = document.getElementById('resultado');
            const produto = data.produto;

            resultado.innerHTML = `
                <div class="produto-encontrado">
                    <div class="ean-display">${ean}</div>
                    ${produto.imagem_url ? `<img src="${produto.imagem_url}" alt="${produto.nome}">` : ''}
                    <h3>${produto.nome}</h3>
                    ${produto.marca ? `<p>Marca: ${produto.marca}</p>` : ''}
                    <p style="color: #666;">Fonte: ${data.fonte}</p>

                    ${data.precos && data.precos.length > 0 ? `
                        <div class="preco-lista">
                            <h4>Precos encontrados:</h4>
                            ${data.precos.map(p => `
                                <div class="preco-item">
                                    <span>${p.supermercado}</span>
                                    <strong>R$ ${p.preco.toFixed(2)}</strong>
                                </div>
                            `).join('')}
                        </div>
                    ` : '<p style="margin-top: 15px; color: #666;">Nenhum preco encontrado. Seja o primeiro a adicionar!</p>'}

                    <button class="btn btn-primary" onclick="adicionarPreco('${ean}', '${produto.nome}')">
                        Adicionar Preco
                    </button>
                    <button class="btn btn-secondary" onclick="scanNovamente()">
                        Escanear Outro
                    </button>
                </div>
            `;
        }

        function showNotFound(ean, erro) {
            const resultado = document.getElementById('resultado');

            resultado.innerHTML = `
                <div class="produto-encontrado">
                    <div class="ean-display">${ean}</div>
                    <span style="font-size: 3rem;">❓</span>
                    <h3>Produto nao encontrado</h3>
                    <p style="color: #666;">${erro || 'Este produto ainda nao esta cadastrado'}</p>

                    <button class="btn btn-primary" onclick="cadastrarProduto('${ean}')">
                        Cadastrar Produto
                    </button>
                    <button class="btn btn-secondary" onclick="scanNovamente()">
                        Escanear Outro
                    </button>
                </div>
            `;
        }

        function showError(message) {
            const resultado = document.getElementById('resultado');
            resultado.classList.remove('hidden');
            resultado.innerHTML = `
                <div class="produto-encontrado">
                    <span style="font-size: 3rem;">⚠️</span>
                    <h3>${message}</h3>
                    <button class="btn btn-secondary" onclick="scanNovamente()">
                        Tentar Novamente
                    </button>
                </div>
            `;
        }

        function scanNovamente() {
            document.getElementById('resultado').classList.add('hidden');
            document.getElementById('fileInput').value = '';
        }

        function adicionarPreco(ean, nome) {
            // Redireciona para pagina de contribuicao com os dados
            localStorage.setItem('produto_ean', ean);
            localStorage.setItem('produto_nome', nome);
            window.location.href = '/contribuir.html';
        }

        function cadastrarProduto(ean) {
            localStorage.setItem('produto_ean', ean);
            window.location.href = '/contribuir.html';
        }
    </script>
</body>
</html>
