<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10b981">
    <title>Scanner de Codigo de Barras - Comparador de Precos</title>
    <link rel="stylesheet" href="/css/neomorphic.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .page-header {
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            box-shadow: var(--shadow-neo-out);
        }

        .page-header h1 {
            color: var(--text-primary);
            font-size: 22px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            text-decoration: none;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-neo-out);
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 14px;
            border: none;
            background: var(--bg-primary);
            border-radius: var(--border-radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--shadow-neo-in);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .mode-btn.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: var(--shadow-neo-out);
        }

        .scanner-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        #video {
            width: 100%;
            border-radius: var(--border-radius-sm);
            background: #000;
        }

        #canvas { display: none; }

        .scanner-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 100px;
            border: 3px solid var(--primary);
            border-radius: var(--border-radius-sm);
            pointer-events: none;
        }

        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--primary);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        .upload-area {
            border: 3px dashed var(--primary);
            border-radius: var(--border-radius);
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--primary-light);
        }

        .upload-area:hover {
            border-color: var(--primary-hover);
            background: var(--bg-secondary);
        }

        .upload-area .material-symbols-outlined {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .upload-area input { display: none; }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: var(--border-radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: var(--shadow-neo-out);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
            box-shadow: var(--shadow-neo-in);
        }

        .btn-primary { background: var(--primary-gradient); color: white; }
        .btn-secondary { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; }
        .btn-stop { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; }

        .resultado {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-top: 20px;
            box-shadow: var(--shadow-neo-out);
        }

        .produto-encontrado {
            text-align: center;
        }

        .produto-encontrado img {
            max-width: 150px;
            border-radius: var(--border-radius-sm);
            margin-bottom: 15px;
        }

        .produto-encontrado h3 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .preco-lista {
            margin-top: 15px;
            text-align: left;
        }

        .preco-lista h4 {
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .preco-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: var(--bg-primary);
            border-radius: var(--border-radius-sm);
            margin-bottom: 8px;
            box-shadow: var(--shadow-neo-in);
        }

        .preco-item span {
            color: var(--text-secondary);
        }

        .preco-item strong {
            color: var(--primary);
            font-size: 18px;
        }

        .ean-display {
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            color: var(--primary);
            padding: 15px;
            border-radius: var(--border-radius-sm);
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px;
            text-align: center;
            margin: 15px 0;
            letter-spacing: 2px;
        }

        .hidden { display: none !important; }

        .status {
            text-align: center;
            padding: 12px;
            color: var(--text-secondary);
            background: var(--bg-primary);
            border-radius: var(--border-radius-sm);
            margin-top: 15px;
            box-shadow: var(--shadow-neo-in);
        }

        .not-found-icon {
            font-size: 64px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">
            <span class="material-symbols-outlined">arrow_back</span>
            Voltar
        </a>

        <div class="page-header">
            <h1>
                <span class="material-symbols-outlined">barcode_scanner</span>
                Scanner de Codigo de Barras
            </h1>
            <p>Escaneie o codigo de barras para encontrar o produto</p>
        </div>

        <div class="card">
            <div class="mode-selector">
                <button class="mode-btn active" onclick="setMode('camera')" id="btnCamera">
                    <span class="material-symbols-outlined">photo_camera</span>
                    Camera
                </button>
                <button class="mode-btn" onclick="setMode('upload')" id="btnUpload">
                    <span class="material-symbols-outlined">upload_file</span>
                    Upload
                </button>
            </div>

            <!-- Modo Camera -->
            <div id="cameraMode">
                <div class="scanner-container">
                    <video id="video" autoplay playsinline></video>
                    <canvas id="canvas"></canvas>
                    <div class="scanner-overlay">
                        <div class="scanner-line"></div>
                    </div>
                </div>
                <p class="status" id="cameraStatus">Posicione o codigo de barras na area verde</p>
                <button class="btn btn-primary" id="btnStart" onclick="startCamera()">
                    <span class="material-symbols-outlined">videocam</span>
                    Iniciar Camera
                </button>
                <button class="btn btn-stop hidden" id="btnStop" onclick="stopCamera()">
                    <span class="material-symbols-outlined">stop</span>
                    Parar Camera
                </button>
            </div>

            <!-- Modo Upload -->
            <div id="uploadMode" class="hidden">
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <span class="material-symbols-outlined">photo_camera</span>
                    <p style="font-weight: 600; margin-bottom: 8px;">Clique ou arraste uma foto</p>
                    <p style="font-size: 14px; color: var(--text-secondary);">do codigo de barras</p>
                    <input type="file" id="fileInput" accept="image/*" onchange="handleFileUpload(event)">
                </div>
            </div>
        </div>

        <!-- Resultado -->
        <div id="resultado" class="hidden"></div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a class="nav-item" href="/">
            <span class="material-symbols-outlined nav-item-icon">home</span>
            <span class="nav-item-label">Inicio</span>
        </a>
        <a class="nav-item active" href="/scanner.html">
            <span class="material-symbols-outlined nav-item-icon">qr_code_scanner</span>
            <span class="nav-item-label">Scanner</span>
        </a>
        <div class="fab-container">
            <a class="fab" href="/contribuir.html">
                <span class="material-symbols-outlined">add</span>
            </a>
        </div>
        <a class="nav-item" href="/lista-compras.html">
            <span class="material-symbols-outlined nav-item-icon">checklist</span>
            <span class="nav-item-label">Lista</span>
        </a>
        <a class="nav-item" href="/">
            <span class="material-symbols-outlined nav-item-icon">person</span>
            <span class="nav-item-label">Perfil</span>
        </a>
    </nav>

    <script>
        // Initialize theme
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
        initTheme();

        const API_URL = 'http://localhost:8000';
        let video, canvas, ctx;
        let scanning = false;
        let stream = null;
        let codeReader = null;

        document.addEventListener('DOMContentLoaded', () => {
            video = document.getElementById('video');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            const hints = new Map();
            hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                ZXing.BarcodeFormat.EAN_13,
                ZXing.BarcodeFormat.EAN_8,
                ZXing.BarcodeFormat.UPC_A,
                ZXing.BarcodeFormat.UPC_E,
                ZXing.BarcodeFormat.CODE_128,
                ZXing.BarcodeFormat.CODE_39,
                ZXing.BarcodeFormat.ITF,
                ZXing.BarcodeFormat.QR_CODE
            ]);
            hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

            codeReader = new ZXing.BrowserMultiFormatReader(hints);
        });

        function setMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn${mode === 'camera' ? 'Camera' : 'Upload'}`).classList.add('active');

            document.getElementById('cameraMode').classList.toggle('hidden', mode !== 'camera');
            document.getElementById('uploadMode').classList.toggle('hidden', mode !== 'upload');

            if (mode !== 'camera') {
                stopCamera();
            }
        }

        async function startCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        focusMode: 'continuous'
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                await video.play();

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                document.getElementById('btnStart').classList.add('hidden');
                document.getElementById('btnStop').classList.remove('hidden');
                document.getElementById('cameraStatus').textContent = 'Escaneando... Aponte para o codigo de barras';

                scanning = true;
                scanFrame();
            } catch (error) {
                console.error('Erro ao acessar camera:', error);
                alert('Nao foi possivel acessar a camera. Verifique as permissoes.');
            }
        }

        function stopCamera() {
            scanning = false;

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }

            video.srcObject = null;

            document.getElementById('btnStart').classList.remove('hidden');
            document.getElementById('btnStop').classList.add('hidden');
            document.getElementById('cameraStatus').textContent = 'Camera parada';
        }

        async function scanFrame() {
            if (!scanning) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                try {
                    const result = await codeReader.decodeFromVideoElement(video);
                    if (result) {
                        console.log('Codigo encontrado:', result.text, 'Formato:', result.getBarcodeFormat());
                        handleBarcodeFound(result.text);
                        return;
                    }
                } catch (e) {
                    if (!(e instanceof ZXing.NotFoundException)) {
                        console.error('Erro de leitura:', e);
                    }
                }
            }

            if (scanning) {
                setTimeout(() => requestAnimationFrame(scanFrame), 100);
            }
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('cameraStatus').textContent = 'Processando imagem...';

            const reader = new FileReader();
            reader.onload = async (e) => {
                const img = new Image();
                img.onload = async () => {
                    const code = await tryDecodeImage(img);

                    if (code) {
                        handleBarcodeFound(code);
                    } else {
                        console.log('Nao encontrado localmente, enviando para API...');
                        await sendImageToAPI(file);
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function tryDecodeImage(img) {
            canvas.width = img.width;
            canvas.height = img.height;

            const attempts = [
                { scale: 1, contrast: 1, brightness: 0 },
                { scale: 1.5, contrast: 1.2, brightness: 10 },
                { scale: 1, contrast: 1.5, brightness: 20 },
                { scale: 2, contrast: 1.3, brightness: 0 },
                { scale: 1, contrast: 1, brightness: 0, grayscale: true },
            ];

            for (const attempt of attempts) {
                try {
                    const processedCanvas = processImage(img, attempt);
                    const result = await codeReader.decodeFromImageElement(processedCanvas);

                    if (result) {
                        console.log('Encontrado na tentativa:', attempt);
                        return result.text;
                    }
                } catch (e) {
                    // Continue trying
                }
            }

            return null;
        }

        function processImage(img, options) {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');

            const scale = options.scale || 1;
            tempCanvas.width = img.width * scale;
            tempCanvas.height = img.height * scale;

            tempCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);

            if (options.contrast !== 1 || options.brightness !== 0 || options.grayscale) {
                const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const data = imageData.data;

                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i];
                    let g = data[i + 1];
                    let b = data[i + 2];

                    if (options.grayscale) {
                        const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                        r = g = b = gray;
                    }

                    r = Math.min(255, Math.max(0, (r - 128) * options.contrast + 128 + options.brightness));
                    g = Math.min(255, Math.max(0, (g - 128) * options.contrast + 128 + options.brightness));
                    b = Math.min(255, Math.max(0, (b - 128) * options.contrast + 128 + options.brightness));

                    data[i] = r;
                    data[i + 1] = g;
                    data[i + 2] = b;
                }

                tempCtx.putImageData(imageData, 0, 0);
            }

            return tempCanvas;
        }

        async function sendImageToAPI(file) {
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_URL}/api/escanear-codigo-barras`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.sucesso && data.ean) {
                    handleBarcodeFound(data.ean);
                } else {
                    showError('Codigo de barras nao encontrado na imagem');
                }
            } catch (error) {
                console.error('Erro:', error);
                showError('Erro ao processar imagem');
            }
        }

        async function handleBarcodeFound(ean) {
            stopCamera();

            const resultado = document.getElementById('resultado');
            resultado.classList.remove('hidden');
            resultado.innerHTML = `
                <div class="ean-display">${ean}</div>
                <p class="status">Buscando produto...</p>
            `;

            try {
                const formData = new FormData();
                formData.append('ean', ean);

                const response = await fetch(`${API_URL}/api/buscar-ean`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.sucesso) {
                    showProductResult(data, ean);
                } else {
                    showNotFound(ean, data.erro);
                }
            } catch (error) {
                console.error('Erro:', error);
                showError('Erro ao buscar produto');
            }
        }

        function showProductResult(data, ean) {
            const resultado = document.getElementById('resultado');
            const produto = data.produto;

            resultado.innerHTML = `
                <div class="produto-encontrado">
                    <div class="ean-display">${ean}</div>
                    ${produto.imagem_url ? `<img src="${produto.imagem_url}" alt="${produto.nome}">` : ''}
                    <h3>${produto.nome}</h3>
                    ${produto.marca ? `<p style="color: var(--text-secondary);">Marca: ${produto.marca}</p>` : ''}
                    <p style="color: var(--text-muted); font-size: 13px;">Fonte: ${data.fonte}</p>

                    ${data.precos && data.precos.length > 0 ? `
                        <div class="preco-lista">
                            <h4>Precos encontrados:</h4>
                            ${data.precos.map(p => `
                                <div class="preco-item">
                                    <span>${p.supermercado}</span>
                                    <strong>R$ ${p.preco.toFixed(2)}</strong>
                                </div>
                            `).join('')}
                        </div>
                    ` : '<p style="margin-top: 15px; color: var(--text-secondary);">Nenhum preco encontrado. Seja o primeiro a adicionar!</p>'}

                    <button class="btn btn-primary" onclick="adicionarPreco('${ean}', '${produto.nome}')">
                        <span class="material-symbols-outlined">add_shopping_cart</span>
                        Adicionar Preco
                    </button>
                    <button class="btn btn-secondary" onclick="scanNovamente()">
                        <span class="material-symbols-outlined">refresh</span>
                        Escanear Outro
                    </button>
                </div>
            `;
        }

        function showNotFound(ean, erro) {
            const resultado = document.getElementById('resultado');

            resultado.innerHTML = `
                <div class="produto-encontrado">
                    <div class="ean-display">${ean}</div>
                    <span class="material-symbols-outlined not-found-icon">help_outline</span>
                    <h3>Produto nao encontrado</h3>
                    <p style="color: var(--text-secondary);">${erro || 'Este produto ainda nao esta cadastrado'}</p>

                    <button class="btn btn-primary" onclick="cadastrarProduto('${ean}')">
                        <span class="material-symbols-outlined">add_circle</span>
                        Cadastrar Produto
                    </button>
                    <button class="btn btn-secondary" onclick="scanNovamente()">
                        <span class="material-symbols-outlined">refresh</span>
                        Escanear Outro
                    </button>
                </div>
            `;
        }

        function showError(message) {
            const resultado = document.getElementById('resultado');
            resultado.classList.remove('hidden');
            resultado.innerHTML = `
                <div class="produto-encontrado">
                    <span class="material-symbols-outlined not-found-icon">warning</span>
                    <h3>${message}</h3>
                    <button class="btn btn-secondary" onclick="scanNovamente()">
                        <span class="material-symbols-outlined">refresh</span>
                        Tentar Novamente
                    </button>
                </div>
            `;
        }

        function scanNovamente() {
            document.getElementById('resultado').classList.add('hidden');
            document.getElementById('fileInput').value = '';
        }

        function adicionarPreco(ean, nome) {
            localStorage.setItem('produto_ean', ean);
            localStorage.setItem('produto_nome', nome);
            window.location.href = '/contribuir.html';
        }

        function cadastrarProduto(ean) {
            localStorage.setItem('produto_ean', ean);
            window.location.href = '/contribuir.html';
        }
    </script>
</body>
</html>
