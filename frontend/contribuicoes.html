<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10b981">
    <title>Contribuicoes - Comparador de Precos</title>
    <link rel="stylesheet" href="/css/neomorphic.css">
    <style>
        .page-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 40px;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .contrib-card {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-neo-out);
            transition: all 0.3s ease;
        }

        .contrib-card:hover {
            transform: translateY(-2px);
        }

        .contrib-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 16px;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .product-brand {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .product-badges {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .price-container {
            text-align: right;
        }

        .price {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary);
        }

        .contrib-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .detail-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .detail-value {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .contrib-header {
                flex-direction: column;
            }

            .price-container {
                text-align: left;
            }

            .price {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <a href="/index.html" class="view-back-btn">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <div class="header-title">Contribuicoes</div>
        </div>
        <div class="header-right">
            <label class="theme-toggle">
                <input type="checkbox" id="themeSwitch" onchange="toggleTheme()">
                <div class="toggle-track">
                    <div class="toggle-thumb">
                        <span class="material-symbols-outlined" id="themeIcon">light_mode</span>
                    </div>
                </div>
            </label>
        </div>
    </header>

    <div class="page-container">
        <div class="page-header">
            <h1 class="page-title">
                <span class="material-symbols-outlined" style="color: var(--info);">group</span>
                Contribuicoes da Comunidade
            </h1>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color: var(--text-secondary); margin-top: 16px;">Carregando contribuicoes...</p>
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <span class="material-symbols-outlined empty-state-icon">inbox</span>
            <p class="empty-state-title">Nenhuma contribuicao ainda</p>
            <p class="empty-state-text">Seja o primeiro a contribuir!</p>
            <a href="/contribuir.html" class="neo-btn neo-btn-primary" style="margin-top: 16px;">
                <span class="material-symbols-outlined">add</span>
                Adicionar Preco
            </a>
        </div>

        <div id="contribuicoes" class="animate-stagger"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        // Theme Management
        function toggleTheme() {
            const toggle = document.getElementById('themeSwitch');
            const theme = toggle.checked ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            icon.textContent = isDark ? 'dark_mode' : 'light_mode';
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeSwitch').checked = savedTheme === 'dark';
            updateThemeIcon();
        }

        async function loadContribuicoes() {
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('emptyState');
            const container = document.getElementById('contribuicoes');

            try {
                const response = await fetch(`${API_URL}/api/contribuicoes?limit=50`);
                const contribuicoes = await response.json();

                loading.style.display = 'none';

                if (contribuicoes.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }

                contribuicoes.forEach(contrib => {
                    const card = document.createElement('div');
                    card.className = 'contrib-card';

                    const badges = [];
                    if (contrib.em_promocao) {
                        badges.push('<span class="neo-badge neo-badge-promo">PROMO</span>');
                    }
                    if (contrib.verificado) {
                        badges.push('<span class="neo-badge neo-badge-info">Verificado</span>');
                    }

                    const data = new Date(contrib.data_cadastro).toLocaleDateString('pt-BR', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    card.innerHTML = `
                        <div class="contrib-header">
                            <div class="product-info">
                                <div class="product-name">${contrib.produto_nome}</div>
                                ${contrib.marca ? `<div class="product-brand">${contrib.marca}</div>` : ''}
                                <div class="product-badges">${badges.join('')}</div>
                            </div>
                            <div class="price-container">
                                <div class="price">R$ ${contrib.preco.toFixed(2)}</div>
                            </div>
                        </div>
                        <div class="contrib-details">
                            <div class="detail-item">
                                <span class="detail-label">
                                    <span class="material-symbols-outlined" style="font-size: 16px;">store</span>
                                    Supermercado
                                </span>
                                <span class="detail-value">${contrib.supermercado.toUpperCase()}</span>
                            </div>
                            ${contrib.localizacao ? `
                            <div class="detail-item">
                                <span class="detail-label">
                                    <span class="material-symbols-outlined" style="font-size: 16px;">location_on</span>
                                    Localizacao
                                </span>
                                <span class="detail-value">${contrib.localizacao}</span>
                            </div>
                            ` : ''}
                            <div class="detail-item">
                                <span class="detail-label">
                                    <span class="material-symbols-outlined" style="font-size: 16px;">calendar_today</span>
                                    Data
                                </span>
                                <span class="detail-value">${data}</span>
                            </div>
                            ${contrib.usuario_nome ? `
                            <div class="detail-item">
                                <span class="detail-label">
                                    <span class="material-symbols-outlined" style="font-size: 16px;">person</span>
                                    Contribuidor
                                </span>
                                <span class="detail-value">${contrib.usuario_nome}</span>
                            </div>
                            ` : ''}
                        </div>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                console.error('Erro ao carregar contribuicoes:', error);
                loading.innerHTML = `
                    <div class="empty-state">
                        <span class="material-symbols-outlined empty-state-icon" style="color: var(--danger);">error</span>
                        <p class="empty-state-title">Erro ao carregar</p>
                        <p class="empty-state-text">Verifique se o servidor esta rodando</p>
                    </div>
                `;
            }
        }

        initTheme();
        loadContribuicoes();
    </script>
</body>
</html>
